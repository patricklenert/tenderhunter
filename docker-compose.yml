services:
  postgres:
    image: postgres:16-alpine
    container_name: tenderhunter-postgres
    restart: always
    environment:
      POSTGRES_USER: tenderhunter
      POSTGRES_PASSWORD: tenderhunter
      POSTGRES_DB: tenderhunter
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5439:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tenderhunter"]
      interval: 5s
      timeout: 5s
      retries: 5

  searxng:
    image: searxng/searxng:latest
    container_name: tenderhunter-searxng
    restart: always
    environment:
      SEARXNG_BASE_URL: "http://searxng:8080/"
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    ports:
      - "8888:8080"

  meilisearch:
    image: getmeili/meilisearch:v1.13
    container_name: tenderhunter-meili
    restart: always
    ports:
      - "7700:7700"
    environment:
      MEILI_ENV: production
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-meili-default-dev-key-change-me}
    volumes:
      - meili_data:/meili_data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  obscura:
    image: h4ckf0r0day/obscura
    container_name: tenderhunter-obscura
    restart: always
    environment:
      OBSCURA_CDP_TOKEN: ${OBSCURA_CDP_TOKEN:?Set OBSCURA_CDP_TOKEN in .env}
    # Rust headless browser (CDP); replaces in-process Playwright Chromium.
    # Image is distroless (no shell/wget), so no in-container healthcheck is
    # possible — restart: always covers crash recovery. Context caps are
    # process-local, so budget 2 GiB for concurrent app/worker sessions.
    mem_limit: 2g
    memswap_limit: 2g

  app:
    build: .
    container_name: tenderhunter
    restart: always
    command: ["app"]
    env_file:
      - .env
    ports:
      - "3025:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DATABASE_URL: postgresql://tenderhunter:tenderhunter@postgres:5432/tenderhunter
      OBSCURA_CDP_URL: ws://obscura:9222
      COLD_S3_ENDPOINT: ${COLD_S3_ENDPOINT:-http://host.docker.internal:9000}
      COLD_S3_BUCKET: ${COLD_S3_BUCKET:-tender-cold}
      COLD_S3_ACCESS_KEY: ${COLD_S3_ACCESS_KEY:-minioadmin}
      COLD_S3_SECRET_KEY: ${COLD_S3_SECRET_KEY:-minioadmin}
      SAM_API_KEY: ${SAM_API_KEY:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-alerts@tenderhunter.us}
      ZAI_API_KEY: ${ZAI_API_KEY:-}
      LLM_PAID_DAILY_BUDGET_EUR: ${LLM_PAID_DAILY_BUDGET_EUR:-0.1}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_WEEKLY: ${STRIPE_PRICE_WEEKLY:-}
      STRIPE_PRICE_QUARTERLY: ${STRIPE_PRICE_QUARTERLY:-}
      SBA_SUBNET_URL: ${SBA_SUBNET_URL:-https://subnet.sba.gov/client/dsp_Landing.cfm}
      US_SCRAPE_INTERVAL_HOURS: ${US_SCRAPE_INTERVAL_HOURS:-24}
      PUBLIC_SCRAPE_INTERVAL_HOURS: ${PUBLIC_SCRAPE_INTERVAL_HOURS:-48}
      PUBLIC_PAGINATION_PAGES: ${PUBLIC_PAGINATION_PAGES:-3}
      PUBLIC_CPV_CODES_PER_RUN: ${PUBLIC_CPV_CODES_PER_RUN:-20}
      SAM_LOOKBACK_DAYS: ${SAM_LOOKBACK_DAYS:-2}
      SAM_MAX_RECORDS: ${SAM_MAX_RECORDS:-5000}
      SAM_SET_ASIDE: ${SAM_SET_ASIDE:-}
      US_PORTAL_MAX_PAGES: ${US_PORTAL_MAX_PAGES:-2}
      MAX_PDF_LINKS_PER_TENDER: ${MAX_PDF_LINKS_PER_TENDER:-20}
      DOCUMENT_REFRESH_HOURS: ${DOCUMENT_REFRESH_HOURS:-72}
      MAX_PENDING_JOBS: ${MAX_PENDING_JOBS:-5000}
      MAX_CRITICAL_JOB_AGE_MINUTES: ${MAX_CRITICAL_JOB_AGE_MINUTES:-30}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-2}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-https://palemaz.com}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      SEARXNG_URL: http://searxng:8080
      TENDERHUNTER_API_KEY: ${TENDERHUNTER_API_KEY:-}
      NEXT_PUBLIC_SITE_URL: https://palemaz.com
      MEILI_HOST: http://meilisearch:7700
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-meili-default-dev-key-change-me}
      MEILI_EMBEDDINGS_ENABLED: ${MEILI_EMBEDDINGS_ENABLED:-false}
    depends_on:
      postgres:
        condition: service_healthy
      searxng:
        condition: service_started
      meilisearch:
        condition: service_healthy
      obscura:
        condition: service_started
    volumes:
      - app_data:/app/data

  worker:
    build: .
    container_name: tenderhunter-worker
    restart: always
    # The longest job timeout is five hours; allow a full job to finish on shutdown.
    stop_grace_period: 6h
    init: true
    # Chromium now runs in the shared obscura container; the worker only holds
    # the Node heap (1536m), so 2g is sufficient again.
    mem_limit: 2g
    memswap_limit: 2g
    pids_limit: 256
    command: ["worker"]
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DATABASE_URL: postgresql://tenderhunter:tenderhunter@postgres:5432/tenderhunter
      OBSCURA_CDP_URL: ws://obscura:9222
      COLD_S3_ENDPOINT: ${COLD_S3_ENDPOINT:-http://host.docker.internal:9000}
      COLD_S3_BUCKET: ${COLD_S3_BUCKET:-tender-cold}
      COLD_S3_ACCESS_KEY: ${COLD_S3_ACCESS_KEY:-minioadmin}
      COLD_S3_SECRET_KEY: ${COLD_S3_SECRET_KEY:-minioadmin}
      SAM_API_KEY: ${SAM_API_KEY:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-alerts@tenderhunter.us}
      ZAI_API_KEY: ${ZAI_API_KEY:-}
      LLM_PAID_DAILY_BUDGET_EUR: ${LLM_PAID_DAILY_BUDGET_EUR:-0.1}
      SBA_SUBNET_URL: ${SBA_SUBNET_URL:-https://subnet.sba.gov/client/dsp_Landing.cfm}
      US_SCRAPE_INTERVAL_HOURS: ${US_SCRAPE_INTERVAL_HOURS:-24}
      PUBLIC_SCRAPE_INTERVAL_HOURS: ${PUBLIC_SCRAPE_INTERVAL_HOURS:-48}
      PUBLIC_PAGINATION_PAGES: ${PUBLIC_PAGINATION_PAGES:-3}
      PUBLIC_CPV_CODES_PER_RUN: ${PUBLIC_CPV_CODES_PER_RUN:-20}
      SAM_LOOKBACK_DAYS: ${SAM_LOOKBACK_DAYS:-2}
      SAM_MAX_RECORDS: ${SAM_MAX_RECORDS:-5000}
      SAM_SET_ASIDE: ${SAM_SET_ASIDE:-}
      US_PORTAL_MAX_PAGES: ${US_PORTAL_MAX_PAGES:-2}
      MAX_PDF_LINKS_PER_TENDER: ${MAX_PDF_LINKS_PER_TENDER:-20}
      DOCUMENT_REFRESH_HOURS: ${DOCUMENT_REFRESH_HOURS:-72}
      MAX_PENDING_JOBS: ${MAX_PENDING_JOBS:-5000}
      MAX_CRITICAL_JOB_AGE_MINUTES: ${MAX_CRITICAL_JOB_AGE_MINUTES:-30}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-8}
      NODE_OPTIONS: ${NODE_OPTIONS:---max-old-space-size=1536}
      SEARXNG_URL: http://searxng:8080
      MEILI_HOST: http://meilisearch:7700
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-meili-default-dev-key-change-me}
      MEILI_EMBEDDINGS_ENABLED: ${MEILI_EMBEDDINGS_ENABLED:-false}
    depends_on:
      postgres:
        condition: service_healthy
      searxng:
        condition: service_started
      meilisearch:
        condition: service_healthy
      obscura:
        condition: service_started
    volumes:
      - app_data:/app/data

volumes:
  postgres_data:
  app_data:
  meili_data:
